<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KitchenAid">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon-192.png">
  <title>Grocery List — KitchenAid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/editorial.css">
  <script src="/js/theme.js"></script>
  <script src="/js/auth-nav.js" defer></script>
  <link rel="stylesheet" href="/css/grocery.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>

<!-- Desktop Sidebar -->
<aside class="editorial-sidebar">
  <div class="editorial-sidebar-brand">
    <h1>KitchenAid</h1>
  </div>
  <nav class="editorial-sidebar-nav">
    <a href="/" class="editorial-nav-link">
      <span class="material-symbols-outlined">skillet</span>
      Recipes
    </a>
    <a href="/planner.html" class="editorial-nav-link">
      <span class="material-symbols-outlined">calendar_month</span>
      Planner
    </a>
    <a href="/grocery.html" class="editorial-nav-link active">
      <span class="material-symbols-outlined">shopping_cart</span>
      Grocery List
    </a>
    <a href="/pantry.html" class="editorial-nav-link">
      <span class="material-symbols-outlined">shopping_basket</span>
      Pantry
    </a>
    <a href="/add.html" class="editorial-nav-link">
      <span class="material-symbols-outlined">add_circle</span>
      Add Recipe
    </a>
    <a href="/settings.html" class="editorial-nav-link">
      <span class="material-symbols-outlined">settings</span>
      Settings
    </a>
  </nav>
</aside>

<div class="editorial-page">

  <header class="editorial-topnav">
    <div class="editorial-topnav-inner">
      <span class="editorial-topnav-brand">Grocery List</span>
      <div class="editorial-topnav-actions">
        <button id="theme-toggle-btn" class="editorial-icon-btn" title="Switch to dark mode">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <a href="/settings.html" class="editorial-icon-btn" title="Settings">
          <span class="material-symbols-outlined">settings</span>
        </a>
      </div>
    </div>
  </header>

  <div class="editorial-page-content grocery-page-content">

    <form class="gl-add-row" id="gl-add-form" autocomplete="off">
      <input class="form-input gl-add-name" id="gl-add-name" type="text" placeholder="Add an item…" required>
      <input class="form-input gl-add-amount" id="gl-add-amount" type="number" inputmode="decimal" min="0" step="any" placeholder="qty">
      <input class="form-input gl-add-unit" id="gl-add-unit" type="text" placeholder="unit">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="gl-toolbar">
      <span class="gl-count" id="gl-count"></span>
      <div class="gl-toolbar-actions">
        <button id="add-week-btn" class="btn btn-secondary btn-sm" title="Add this week's plan to the list">
          <span class="material-symbols-outlined" style="font-size:1rem">calendar_month</span>
          Add this week
        </button>
        <button id="copy-keep-btn" class="btn btn-secondary btn-sm" title="Copy unchecked items to Google Keep">
          <span class="material-symbols-outlined" style="font-size:1rem">content_copy</span>
          Copy to Keep
        </button>
        <button id="clear-done-btn" class="btn btn-secondary btn-sm">Clear done</button>
        <button id="clear-all-btn" class="btn btn-secondary btn-sm gl-clear-all">Clear all</button>
      </div>
    </div>

    <ul class="gl-list" id="gl-list">
      <li class="gl-loading"><div class="spinner"></div></li>
    </ul>

  </div>
</div>

<!-- Mobile Bottom Nav -->
<nav class="editorial-bottom-nav">
  <a href="/" class="editorial-bottom-nav-item">
    <span class="material-symbols-outlined">home</span>
    Home
  </a>
  <a href="/planner.html" class="editorial-bottom-nav-item">
    <span class="material-symbols-outlined">menu_book</span>
    Plans
  </a>
  <a href="/grocery.html" class="editorial-bottom-nav-item active">
    <span class="material-symbols-outlined">shopping_cart</span>
    List
  </a>
  <a href="/pantry.html" class="editorial-bottom-nav-item">
    <span class="material-symbols-outlined">inventory_2</span>
    Pantry
  </a>
  <a href="/add.html" class="editorial-bottom-nav-item">
    <span class="material-symbols-outlined">add_box</span>
    Add
  </a>
  <a href="/settings.html" class="editorial-bottom-nav-item">
    <span class="material-symbols-outlined">settings</span>
    Settings
  </a>
</nav>

<div id="toast-container" class="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/units.js"></script>
<script src="/js/grocery.js"></script>
</body>
</html>
